<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Processamento de Texto - CAED</title>
    <!-- Tailwind CSS via CDN para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-12 px-4 flex flex-col items-center space-y-12">

    <!-- CARD 1: Classificador de Complexidade -->
    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8 border border-slate-200">
        <h1 class="text-3xl font-bold text-slate-800 text-center mb-2">Classificador de Complexidade</h1>
        <p class="text-slate-500 text-center mb-6">Insira o texto abaixo para que a Inteligência Artificial avalie o nível de dificuldade.</p>

        <!-- Entrada de Texto -->
        <div class="mb-6">
            <textarea id="textInput" rows="5" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition duration-200 resize-none text-slate-700" placeholder="Cole ou digite seu texto aqui..."></textarea>
        </div>

        <!-- Botão de Ação -->
        <button id="categorizeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition duration-200 ease-in-out">
            Categorizar Texto
        </button>

        <!-- Container do Resultado -->
        <div id="resultContainer" class="mt-8 hidden transition-all duration-300 transform opacity-0 translate-y-4">
            <div class="p-6 rounded-xl text-center border">
                <p class="text-sm uppercase tracking-wider font-semibold text-slate-500 mb-1">Nível Estimado</p>
                <h2 id="resultLevel" class="text-2xl font-extrabold mb-2">---</h2>
                <p id="resultDesc" class="text-sm opacity-90">---</p>
            </div>
        </div>
    </div>


    <!-- CARD 2: Gerador de Variação Lexical (Troca de Palavras) -->
    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-8 border border-slate-200">
        <h2 class="text-3xl font-bold text-slate-800 text-center mb-2">Substituição de Palavras</h2>
        <p class="text-slate-500 text-center mb-6">Altere automaticamente o texto trocando palavras por sinônimos ou antônimos.</p>

        <!-- Entrada de Texto -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Texto Original:</label>
            <textarea id="trocaTextInput" rows="5" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition duration-200 resize-none text-slate-700" placeholder="Digite ou cole o texto para modificar..."></textarea>
        </div>

        <!-- Opções (Modo e Taxa de Troca) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Modo de Substituição:</label>
                <select id="modoSelect" class="w-full p-3 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700">
                    <option value="sinonimo">Sinônimos</option>
                    <option value="antonimo">Antônimos</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Taxa de Alteração: <span id="probValue" class="text-emerald-600 font-bold">50%</span></label>
                <input id="probRange" type="range" min="0.1" max="1.0" step="0.1" value="0.5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 mt-3">
            </div>
        </div>

        <!-- Botão de Gerar -->
        <button id="trocarBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition duration-200 ease-in-out">
            Gerar Novo Texto
        </button>

        <!-- Resultado do Texto Modificado -->
        <div id="trocaResultContainer" class="mt-8 hidden">
            <label class="block text-sm font-semibold text-slate-700 mb-2">Resultado Modificado:</label>
            <div id="trocaResultBox" class="p-4 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 leading-relaxed font-normal whitespace-pre-wrap"></div>
        </div>
    </div>


    <!-- Script JavaScript responsável pela lógica da página -->
    <script>
        // ==========================================
        // LÓGICA DO CARD 1: Classificador
        // ==========================================
        const categories = {
            BEGINNER: {
                label: "Ensino fundamental I (Nível 1)",
                desc: "Texto simples, com vocabulário acessível e estruturas sintáticas diretas.",
                colors: "bg-emerald-50 border-emerald-300 text-emerald-800"
            },
            INTERMEDIATE: {
                label: "Ensino fundamental II (Nível 2)",
                desc: "Texto com complexidade média, construções frasais mais elaboradas e vocabulário diversificado.",
                colors: "bg-amber-50 border-amber-300 text-amber-800"
            },
            ADVANCED: {
                label: "Ensino médio I (Nível 3)",
                desc: "Texto denso, com vocabulário técnico/formal e estruturas sintáticas complexas.",
                colors: "bg-rose-50 border-rose-300 text-rose-800"
            },
            EXPERT: {
                label: "Ensino Superior (Nível 4)",
                desc: "Texto altamente técnico ou acadêmico com alto nível de abstração.",
                colors: "bg-purple-50 border-purple-300 text-purple-800"
            }
        };

        const textInput = document.getElementById('textInput');
        const categorizeBtn = document.getElementById('categorizeBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultLevel = document.getElementById('resultLevel');
        const resultDesc = document.getElementById('resultDesc');

        categorizeBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                textInput.classList.add('border-red-500');
                setTimeout(() => textInput.classList.remove('border-red-500'), 1000);
                return;
            }

            categorizeBtn.disabled = true;
            categorizeBtn.textContent = 'A processar pela IA...';
            categorizeBtn.classList.add('opacity-75', 'cursor-not-allowed');

            resultContainer.classList.add('hidden', 'opacity-0', 'translate-y-4');
            resultContainer.firstElementChild.className = 'p-6 rounded-xl text-center border'; 

            try {
                const response = await fetch('http://127.0.0.1:5000/api/avaliar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto: text })
                });
                const data = await response.json();
                const nivelRetornado = data.nivel.toUpperCase();

                let result = categories.EXPERT;
                if (nivelRetornado.includes('INICIANTE') || nivelRetornado === '1') result = categories.BEGINNER;
                else if (nivelRetornado.includes('INTERMEDI') || nivelRetornado === '2') result = categories.INTERMEDIATE;
                else if (nivelRetornado.includes('AVANÇADO') || nivelRetornado === '3') result = categories.ADVANCED;

                resultLevel.textContent = result.label;
                resultDesc.textContent = result.desc;
                resultContainer.firstElementChild.classList.add(...result.colors.split(' '));
                
                resultContainer.classList.remove('hidden');
                setTimeout(() => resultContainer.classList.remove('opacity-0', 'translate-y-4'), 50);
            } catch (error) {
                alert("Erro ao conectar com a API do classificador.");
            } finally {
                categorizeBtn.disabled = false;
                categorizeBtn.textContent = 'Categorizar Texto';
                categorizeBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });


        // ==========================================
        // LÓGICA DO CARD 2: Troca de Palavras
        // ==========================================
        const trocaTextInput = document.getElementById('trocaTextInput');
        const modoSelect = document.getElementById('modoSelect');
        const probRange = document.getElementById('probRange');
        const probValue = document.getElementById('probValue');
        const trocarBtn = document.getElementById('trocarBtn');
        const trocaResultContainer = document.getElementById('trocaResultContainer');
        const trocaResultBox = document.getElementById('trocaResultBox');

        // Atualiza a porcentagem ao arrastar o slider
        probRange.addEventListener('input', (e) => {
            probValue.textContent = Math.round(e.target.value * 100) + '%';
        });

        trocarBtn.addEventListener('click', async () => {
            const text = trocaTextInput.value.trim();
            if (!text) {
                trocaTextInput.classList.add('border-red-500');
                setTimeout(() => trocaTextInput.classList.remove('border-red-500'), 1000);
                return;
            }

            trocarBtn.disabled = true;
            trocarBtn.textContent = 'Substituindo palavras...';
            trocarBtn.classList.add('opacity-75', 'cursor-not-allowed');
            trocaResultContainer.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:5000/api/troca-palavra', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        texto: text,
                        modo: modoSelect.value,
                        prob_troca: parseFloat(probRange.value)
                    })
                });

                if (!response.ok) throw new Error("Erro na API");

                const data = await response.json();
                trocaResultBox.textContent = data.texto_modificado;
                trocaResultContainer.classList.remove('hidden');

            } catch (error) {
                alert("Erro ao processar a troca de palavras. Verifique o terminal do Python.");
            } finally {
                trocarBtn.disabled = false;
                trocarBtn.textContent = 'Gerar Novo Texto';
                trocarBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
